name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Enforce MCP composition boundary
        run: npm run check:mcp-boundary

      - name: Run tests
        run: npm test

      - name: Knowledge FTS5 quality baseline
        run: npm run benchmark:knowledge-fts
        env:
          KNOWLEDGE_BENCHMARK_DOCUMENTS: 100000
          KNOWLEDGE_BENCHMARK_REPETITIONS: 20
          KNOWLEDGE_BENCHMARK_MAX_P95_MS: 200

      - name: Build backend and frontend
        run: npm run build
